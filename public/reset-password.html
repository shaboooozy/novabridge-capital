<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | NovaBridge</title><link rel="stylesheet" href="/legal.css"><style>form{max-width:420px}label{display:block;color:#bdc6b9;margin:18px 0 6px}input,button{width:100%;padding:13px;border:1px solid #2b3029;border-radius:9px;background:#111311;color:#f1f5ec;font:inherit}button{margin-top:20px;background:#c4f34a;color:#101408;font-weight:800;cursor:pointer}.result{margin-top:18px}</style></head><body><main><a href="/">NOVA<span>BRIDGE</span></a><h1>Reset your password</h1><p>Choose a new password for your account.</p><form id="form"><label for="password">New password</label><input id="password" type="password" minlength="8" required><button>Update password</button></form><p class="result" id="result"></p></main><script>const token=new URLSearchParams(location.search).get('token');document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:document.querySelector('#password').value})});const d=await r.json();document.querySelector('#result').textContent=r.ok?'Password updated. You can sign in now.':(d.error||'Unable to reset password.');});</script></body></html>
