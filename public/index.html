<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaBridge Capital</title>
  <style>
    :root { --bg:#f4f8fc; --panel:#fff; --stroke:#dbe7f5; --text:#0b192c; --muted:#526780; --brand:#0500ff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:640px; margin:0 auto; padding:48px 20px 80px; }
    a.brand { color:var(--text); font-weight:800; letter-spacing:.16em; text-decoration:none; }
    h1 { font-size:2rem; margin:28px 0 8px; }
    p { color:var(--muted); line-height:1.5; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:24px; }
    .btn { display:inline-block; padding:12px 16px; border-radius:12px; text-decoration:none; font-weight:700; border:1px solid var(--stroke); color:var(--text); background:#fff; }
    .btn.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/">NOVABRIDGE</a>
    <h1>Account</h1>
    <p>Sign in to copy the deposit address, request a withdrawal, or open admin.</p>
    <div class="actions">
      <a class="btn primary" href="/dashboard/apps">Open account</a>
      <a class="btn" href="/admin">Admin</a>
    </div>
  </main>
</body>
</html>
